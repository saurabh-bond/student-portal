name: Deploy to Dev
on:
  push:
    branches:
      - develop
permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ap-south-1
      - name: Build SAM Backend
        run: |
          cd backend
          sam build --use-container
      - name: Deploy SAM Backend
        run: |
          cd backend
          sam deploy --config-env dev --no-fail-on-empty-changeset

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Angular
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration=development
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ap-south-1
      - name: Sync S3 & Invalidate CloudFront
        run: |
          aws s3 sync frontend/dist/frontend/browser s3://${{ secrets.FRONTEND_BUCKET_DEV }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID_DEV }} --paths "/*"
